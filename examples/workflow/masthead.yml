# Copy to .github/workflows/masthead.yml in your profile repo (github.com/<you>/<you>).
# Put configs exported from the editor in masthead/*.json. Every push that changes one
# re-renders the light and dark SVGs into assets/ and commits them.
name: Render README banners

on:
  push:
    paths: ['masthead/*.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Murali1801/masthead
          path: .masthead

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install renderer
        run: npm ci --omit=dev --prefix .masthead

      - name: Render SVGs
        run: node .masthead/bin/masthead.mjs masthead --out assets

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Render README banners"
          git push
